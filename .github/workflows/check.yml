name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # Private dkoosis modules bypass the public proxy and authenticate with a
      # PAT. Add DKOOSIS_MODULES_TOKEN in repo Settings → Secrets before merge —
      # this step fails loudly if it is missing (module fetch would fail anyway).
      - name: configure access to private dkoosis modules
        env:
          DKOOSIS_MODULES_TOKEN: ${{ secrets.DKOOSIS_MODULES_TOKEN }}
        run: |
          if [ -z "$DKOOSIS_MODULES_TOKEN" ]; then
            echo "::error::DKOOSIS_MODULES_TOKEN secret not set — add it in repo Settings → Secrets."
            exit 1
          fi
          echo "GOPRIVATE=github.com/dkoosis/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${DKOOSIS_MODULES_TOKEN}@github.com/dkoosis/".insteadOf "https://github.com/dkoosis/"

      - name: golangci-lint (pinned in .sandbox/project.conf)
        run: |
          . ./.sandbox/project.conf
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: check
        run: make check

      # The -race gate (epic ccp-sbp.4) survives the collapse as a make verb, not
      # as re-implemented YAML. CI = local check + race; no step here duplicates
      # what a Makefile target already owns.
      - name: race
        run: make race
